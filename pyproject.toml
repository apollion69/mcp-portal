[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-portal"
version = "0.1.0"
description = "Stdio MCP server that delegates bulk reads and boilerplate generation to the Cursor CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "apollion69" }]
keywords = ["mcp", "cursor", "model-context-protocol", "delegation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/apollion69/mcp-portal"
Repository = "https://github.com/apollion69/mcp-portal"
Issues = "https://github.com/apollion69/mcp-portal/issues"

[project.scripts]
mcp-portal = "mcp_portal.server:main"
mcp-portal-doctor = "mcp_portal.probe:main"
mcp-portal-bulk-read = "mcp_portal.bulk_read:main"

[tool.hatch.build.targets.wheel]
only-include = ["mcp_portal"]

[tool.hatch.build.targets.wheel.sources]
"src/mcp_portal" = "mcp_portal"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
