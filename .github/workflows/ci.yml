name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest hatchling
          pip install -e .
      - name: pytest
        run: python -m pytest -q

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build wheel
        run: uv build --wheel -o dist
      - name: Install wheel in fresh venv and smoke-test CLI
        run: |
          python3 -m venv /tmp/mcp-portal-smoke-venv
          /tmp/mcp-portal-smoke-venv/bin/pip install --upgrade pip
          /tmp/mcp-portal-smoke-venv/bin/pip install dist/*.whl
          /tmp/mcp-portal-smoke-venv/bin/mcp-portal-doctor | head -n 5
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          list='{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          out=$(printf '%s\n%s\n' "$init" "$list" | /tmp/mcp-portal-smoke-venv/bin/mcp-portal)
          echo "$out" | grep -q bulk_read
          echo "$out" | grep -q code_write
          echo "$out" | grep -q status
